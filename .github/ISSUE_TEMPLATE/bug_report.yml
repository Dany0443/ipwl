name: Bug Report
description: Create a report to help us reproduce and fix an issue
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.
  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft Version
      description: What Minecraft version are you using?
      placeholder: e.g. 26.3, 1.21.1
    validations:
      required: true
  - type: input
    id: mod_version
    attributes:
      label: IPWL Mod Version
      description: What version of IPWL are you running?
      placeholder: e.g. 1.5.4
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can someone reproduce this behavior?
      placeholder: |
        1. Add player with '/ipwl add ...'
        2. Player connects from IP ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server Logs / Crash Report
      description: Paste any relevant server console logs or crash reports here.
      render: text
