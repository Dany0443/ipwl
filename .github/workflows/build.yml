name: Build and Test

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compile mod jar (${{ github.ref_name }})
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile mod with Gradle
        run: ./gradlew build --no-daemon

      - name: Extract branch / ref name for artifact
        id: meta
        shell: bash
        run: |
          SAFE_REF=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "safe_ref=$SAFE_REF" >> "$GITHUB_OUTPUT"

      - name: Upload compiled jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: ipwl-${{ steps.meta.outputs.safe_ref }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 14
