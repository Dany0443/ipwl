name: Build and Draft Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # build each supported mc version
  build:
    name: Build Minecraft ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.21.1'
          - '1.21.2'
          - '1.21.3'
          - '1.21.4'
          - '1.21.5'
          - '1.21.6'
          - '1.21.7'
          - '1.21.8'
          - '1.21.9'
          - '1.21.10'
          - '1.21.11'
          - '26.1'
          - '26.2'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Make gradlew executable
        working-directory: versions/${{ matrix.version }}
        run: chmod +x ./gradlew

      - name: Compile mod with gradle
        working-directory: versions/${{ matrix.version }}
        run: ./gradlew build --no-daemon

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipwl-mc${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/libs/*.jar
          if-no-files-found: error

  # create a draft release if all builds pass and version was bumped
  draft-release:
    name: Check version and draft release
    needs: [build]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check version against github releases
        id: version_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import os, sys, json, urllib.request

          # get mod_version from root gradle.properties
          mod_version = None
          if os.path.exists("gradle.properties"):
              with open("gradle.properties", "r") as f:
                  for line in f:
                      line = line.strip()
                      if line.startswith("mod_version="):
                          mod_version = line.split("=", 1)[1].strip()
                          break
                      elif line.startswith("version=") and not mod_version:
                          mod_version = line.split("=", 1)[1].strip()

          if not mod_version:
              print("::error::Could not find mod_version in gradle.properties")
              sys.exit(1)

          print(f"Current version in repo: {mod_version}")

          # helper to parse version string into integer tuple for comparison
          def parse_version(v_str):
              clean = v_str.lstrip("v").strip()
              parts = []
              for part in clean.split("."):
                  digits = "".join(filter(str.isdigit, part))
                  parts.append(int(digits) if digits else 0)
              return parts

          current_parsed = parse_version(mod_version)

          # fetch all existing releases from github api
          token = os.environ.get("GH_TOKEN", "")
          repo = os.environ.get("REPO", "")
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28"
          }
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases", headers=headers)
          releases = []
          try:
              with urllib.request.urlopen(req) as resp:
                  releases = json.loads(resp.read().decode())
          except Exception as e:
              print(f"No existing releases found or error reading releases: {e}")

          # find the highest released version tag so far
          highest_released = None
          for r in releases:
              tag = r.get("tag_name", "")
              if tag:
                  parsed = parse_version(tag)
                  if highest_released is None or parsed > highest_released[0]:
                      highest_released = (parsed, tag)

          should_release = False
          if highest_released is None:
              print(f"No previous releases found. Will draft initial release for v{mod_version}.")
              should_release = True
          else:
              print(f"Highest existing release tag: {highest_released[1]}")
              if current_parsed > highest_released[0]:
                  print(f"Version bump found ({mod_version} > {highest_released[1]}), drafting release.")
                  should_release = True
              else:
                  print(f"No version bump ({mod_version} <= {highest_released[1]}), skipping release draft.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"mod_version={mod_version}\n")
              gh_out.write(f"should_release={'true' if should_release else 'false'}\n")
          EOF

      - name: Download all compiled jars
        if: steps.version_check.outputs.should_release == 'true'
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          pattern: ipwl-mc*
          merge-multiple: true

      - name: Create draft release
        if: steps.version_check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: "v${{ steps.version_check.outputs.mod_version }}"
          VERSION: "${{ steps.version_check.outputs.mod_version }}"
        run: |
          # clean up existing draft for this tag if it exists
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true
          
          # create draft release with all jars attached
          gh release create "$TAG_NAME" release_artifacts/*.jar \
            --draft \
            --title "IPWL v${VERSION}" \
            --generate-notes
