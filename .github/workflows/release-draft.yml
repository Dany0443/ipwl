name: Draft Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version / tag (e.g. 1.5.5 or v1.5.5). If empty, uses mod_version from gradle.properties.'
        required: false
        default: ''
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-all-versions:
    name: Build Minecraft ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.21.1'
          - '1.21.2'
          - '1.21.3'
          - '1.21.4'
          - '1.21.5'
          - '1.21.6'
          - '1.21.7'
          - '1.21.8'
          - '1.21.9'
          - '1.21.10'
          - '1.21.11'
          - '26.1'
          - '26.2'
          - '26.3'

    steps:
      - name: Checkout version branch
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.version }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile mod with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload compiled jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipwl-release-${{ matrix.version }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 1

  create-draft-release:
    name: Create GitHub Release Draft
    needs: [build-all-versions]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download all compiled jars
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          pattern: ipwl-release-*
          merge-multiple: true

      - name: Create git tag and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.version_tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          # Determine tag name
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            # Extract mod_version from gradle.properties
            TAG_NAME=$(grep -E "^mod_version=" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
            if [ -z "$TAG_NAME" ]; then
              TAG_NAME="1.5.4"
            fi
          fi

          echo "Using release tag: $TAG_NAME"

          # Configure git identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create and push git tag if it does not already exist
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME" || true
          fi

          # Remove existing draft for this tag if one already exists
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true

          # Build extra flags
          EXTRA_FLAGS=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            EXTRA_FLAGS+=("--prerelease")
          fi

          # Create GitHub release draft with all collected jars attached
          gh release create "$TAG_NAME" release_artifacts/*.jar \
            --draft \
            --title "IPWL $TAG_NAME" \
            --target main \
            --generate-notes \
            "${EXTRA_FLAGS[@]}"

          echo "Draft release created successfully for $TAG_NAME"

